[project]
name = "lcqa"
version = "0.1.0"
description = "LLM cost reduction + eval harness for production RAG systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Wiktor N." }]
keywords = ["llm", "rag", "evaluation", "cost-optimization", "ragas", "deepeval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.7.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
providers = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]
all = ["lcqa[providers,eval,dev]"]

[project.urls]
Repository = "https://github.com/neridanek/llm-cost-quality-audit"
Issues = "https://github.com/neridanek/llm-cost-quality-audit/issues"

[project.scripts]
lcqa = "lcqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcqa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
